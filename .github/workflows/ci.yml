name: CI

# The same gate used locally before every merge: if any of these fail, the
# change doesn't go in. The test suite includes src/lib/isolation.test.ts,
# which pins the "nothing leaves the browser / two storage keys" guarantee,
# and mcp/src/isolation.test.ts, which pins the Claude extension's.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The Claude extension (mcp/): its own dependencies, type-check, bundle,
      # and the official manifest validation + pack. Its tests run above
      # (vitest includes mcp/src), incl. mcp/src/isolation.test.ts.
      - run: npm ci
        working-directory: mcp
      - run: npm run typecheck
        working-directory: mcp
      - run: npm run pack:mcpb
        working-directory: mcp
